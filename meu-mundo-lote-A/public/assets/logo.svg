<svg viewBox="0 0 320 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" floodColor="#000000" floodOpacity="0.35" />
    </filter>
    <linearGradient id="sunflowerCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#451a03" />
      <stop offset="100%" stopColor="#1c1917" />
    </linearGradient>
    <linearGradient id="puzzleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f87171" />
      <stop offset="100%" stopColor="#dc2626" />
    </linearGradient>
    <linearGradient id="puzzleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="100%" stopColor="#1d4ed8" />
    </linearGradient>
    <linearGradient id="puzzleYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fde047" />
      <stop offset="100%" stopColor="#eab308" />
    </linearGradient>
    <linearGradient id="puzzleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Estrutura do Cérebro & Galhos da Árvore -->
  <g filter="url(#logoShadow)">
    <path d="M 165 95 C 150 70, 120 60, 95 72 C 65 85, 55 120, 60 148 C 42 165, 45 200, 68 220 C 55 245, 78 275, 110 275 C 135 275, 160 260, 168 238 C 185 248, 205 235, 208 200 C 210 175, 195 145, 185 130 L 165 95 Z" fill="none" stroke="#0a0f24" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 85 125 C 105 130, 125 110, 135 118" fill="none" stroke="#0a0f24" stroke-width="9" stroke-linecap="round" />
    <path d="M 82 170 C 102 188, 138 175, 142 160" fill="none" stroke="#0a0f24" stroke-width="9" stroke-linecap="round" />
    <path d="M 125 185 C 122 210, 145 225, 165 210" fill="none" stroke="#0a0f24" stroke-width="9" stroke-linecap="round" />
    <path d="M 98 225 C 108 245, 130 250, 148 242" fill="none" stroke="#0a0f24" stroke-width="8.5" stroke-linecap="round" />
    <path d="M 188 170 C 195 130, 210 95, 240 70" fill="none" stroke="#0a0f24" stroke-width="8.5" stroke-linecap="round" />
    <path d="M 175 140 C 182 105, 178 75, 195 50" fill="none" stroke="#0a0f24" stroke-width="8" stroke-linecap="round" />
    <path d="M 195 160 C 220 150, 245 155, 270 135" fill="none" stroke="#0a0f24" stroke-width="7" stroke-linecap="round" />
    <path d="M 215 110 C 235 115, 255 105, 265 92" fill="none" stroke="#0a0f24" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Girassóis -->
  <g transform="translate(208, 62) scale(0.9)">
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(0)" />
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(30)" />
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(60)" />
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(90)" />
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(120)" />
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(150)" />
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(180)" />
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(210)" />
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(240)" />
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(270)" />
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(300)" />
    <path d="M 0 -16 C -3 -9, -4 0, 0 0 C 4 0, 3 -9, 0 -16 Z" fill="#eab308" transform="rotate(330)" />
    <circle cx="0" cy="0" r="7.5" fill="url(#sunflowerCenter)" stroke="#ca8a04" stroke-width="1.5" />
  </g>

  <g transform="translate(162, 92) scale(0.7)">
    <circle cx="0" cy="0" r="14" fill="#facc15" />
    <circle cx="0" cy="0" r="6.5" fill="url(#sunflowerCenter)" stroke="#ca8a04" stroke-width="1" />
  </g>

  <g transform="translate(262, 138) scale(0.65)">
    <circle cx="0" cy="0" r="14" fill="#eab308" />
    <circle cx="0" cy="0" r="6" fill="url(#sunflowerCenter)" stroke="#ca8a04" stroke-width="1" />
  </g>

  <!-- Peças de Quebra-cabeça -->
  <g transform="translate(245, 75) rotate(12)" filter="url(#logoShadow)">
    <path d="M 0 0 H 12 C 12 3, 15 5, 18 5 C 21 5, 24 3, 24 0 H 36 V 12 C 39 12, 41 15, 41 18 C 41 21, 39 24, 36 24 V 36 H 24 C 24 33, 21 31, 18 31 C 15 31, 12 33, 12 36 H 0 V 24 C -3 24, -5 21, -5 18 C -5 15, -3 12, 0 12 Z" fill="url(#puzzleRed)" stroke="#991b1b" stroke-width="1.2" />
  </g>

  <g transform="translate(225, 150) rotate(-15)">
    <path d="M 0 0 H 10 C 10 2.5, 12.5 4, 15 4 C 17.5 4, 20 2.5, 20 0 H 30 V 10 C 32.5 10, 34 12.5, 34 15 C 34 17.5, 32.5 20, 30 20 V 30 H 20 C 20 27.5, 17.5 26, 15 26 C 12.5 26, 10 27.5, 10 30 H 0 V 20 C -2.5 20, -4 17.5, -4 15 C -4 12.5, -2.5 10, 0 10 Z" fill="url(#puzzleCyan)" stroke="#0369a1" stroke-width="1" />
  </g>

  <g transform="translate(210, 98) rotate(45)">
    <path d="M 0 0 H 8 C 8 2, 10 3.5, 12 3.5 C 14 3.5, 16 2, 16 0 H 24 V 8 C 26 8, 27.5 10, 27.5 12 C 27.5 14, 26 16, 24 16 V 24 H 16 C 16 22, 14 20.5, 12 20.5 C 10 20.5, 8 22, 8 24 H 0 V 16 C -2 16, -3.5 14, -3.5 12 C -3.5 10, -2 8, 0 8 Z" fill="url(#puzzleYellow)" stroke="#a16207" stroke-width="0.8" />
  </g>

  <g transform="translate(170, 68) rotate(-20)">
    <path d="M 0 0 H 6 C 6 1.5, 7.5 2.5, 9 2.5 C 10.5 2.5, 12 1.5, 12 0 H 18 V 6 C 19.5 6, 20.5 7.5, 20.5 9 C 20.5 10.5, 19.5 12, 18 12 V 18 H 12 C 12 16.5, 10.5 15.5, 9 15.5 C 7.5 15.5, 6 16.5, 6 18 H 0 V 12 C -1.5 12, -2.5 10.5, -2.5 9 C -2.5 7.5, -1.5 6, 0 6 Z" fill="url(#puzzleBlue)" stroke="#1e3a8a" stroke-width="0.8" />
  </g>

  <g transform="translate(142, 80) rotate(-10)">
    <path d="M 0 0 H 6 C 6 1.5, 7.5 2.5, 9 2.5 C 10.5 2.5, 12 1.5, 12 0 H 18 V 6 C 19.5 6, 20.5 7.5, 20.5 9 C 20.5 10.5, 19.5 12, 18 12 V 18 H 12 C 12 16.5, 10.5 15.5, 9 15.5 C 7.5 15.5, 6 16.5, 6 18 H 0 V 12 C -1.5 12, -2.5 10.5, -2.5 9 C -2.5 7.5, -1.5 6, 0 6 Z" fill="url(#puzzleYellow)" stroke="#a16207" stroke-width="0.8" />
  </g>

  <!-- Pontos coloridos -->
  <circle cx="187" cy="53" r="3.5" fill="#facc15" />
  <circle cx="270" cy="115" r="3" fill="#facc15" />
  <circle cx="153" cy="108" r="3.5" fill="#ef4444" />
  <circle cx="236" cy="60" r="3" fill="#ef4444" />
  <circle cx="218" cy="170" r="3" fill="#ef4444" />
  <circle cx="205" cy="105" r="3" fill="#38bdf8" />
</svg>
